services:
  ftp:
    image: delfer/alpine-ftp-server
    container_name: ftp
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    environment:
      - USERS=ftpuser|ftp123|/usr/share/nginx/html|1000
      - ADDRESS=192.168.200.156
    volumes:
      - site-web:/usr/share/nginx/html

  nginx:
    image: nginx:latest
    container_name: web
    ports:
      - "8080:80"
    volumes:
      - site-web:/usr/share/nginx/html:ro
    depends_on:
      - ftp

volumes:
  site-web:
